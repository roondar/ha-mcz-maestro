name: Validate

on:
  push:
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lightweight transport test dependencies
        run: python -m pip install "aiohttp" "python-socketio==5.18.1"
      - name: Compile custom integration
        run: python -m compileall -q custom_components/mcz_maestro
      - name: Test local Socket.IO transport with a fake module
        run: python -m unittest discover -s tests -v
